# Render Blueprint — Chakra Arc Testnet DEX Aggregator

services:
  - type: kv
    name: chakra-redis
    plan: free

  - type: web
    name: chakra-api
    plan: free
    runtime: image
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: CHAKRA_REDIS_URL
        fromKeyValue:
          name: chakra-redis
          property: connectionString
      - key: CHAKRA_RPC_HTTP
        value: https://rpc.testnet.arc.io
      - key: CHAKRA_RPC_WS
        value: wss://rpc.testnet.arc.io
      - key: CHAKRA_RPC_HTTP_FAILOVERS
        value: https://rpc.blockdaemon.testnet.arc.io,https://rpc.drpc.testnet.arc.io,https://rpc.quicknode.testnet.arc.io
      - key: CHAKRA_RPC_WS_FAILOVERS
        value: wss://rpc.drpc.testnet.arc.io,wss://rpc.quicknode.testnet.arc.io
      - key: CHAKRA_CHAIN_ID
        value: "5042002"
      - key: CHAKRA_CORS_ORIGINS
        value: "https://chakra-arc-dex.vercel.app,http://localhost:3000"
      - key: CHAKRA_LISTEN_ADDR
        value: "0.0.0.0:10000"
      - key: CHAKRA_AGGREGATOR
        value: "0xA59ad3E82d251c3489582e1aA5Bee494d0d2a569"
      - key: CHAKRA_MBTC_ADDRESS
        value: "0xbf5a25D7070FaACAe309D66D05372a6b212ECbdF"
      - key: CHAKRA_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: CHAKRA_EURC_ADDRESS
        value: "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a"
      - key: CHAKRA_PERMIT2
        value: "0x000000000022D473030F116dDEE9F6B43aC78BA3"
      - key: CHAKRA_SEED_FACTORIES
        value: "0x0c812E5D55D767533c8E4783D33b28EA825b4D8e:xyk,0x77Ce21FDAAea40Fd94aCf65fF3220A0A7Db7D690:stable,0xf6dEa9e6dfE392aaBE366240db4839709572fa69:clmm"
      - key: CHAKRA_DISCOVERY_FACTORIES
        value: "0x0c812E5D55D767533c8E4783D33b28EA825b4D8e:xyk,0x77Ce21FDAAea40Fd94aCf65fF3220A0A7Db7D690:stable,0xf6dEa9e6dfE392aaBE366240db4839709572fa69:clmm"
      - key: CHAKRA_EVM_WS_ENABLED
        value: "true"
      - key: CHAKRA_EVM_POLL_INTERVAL_MS
        value: "500"
      - key: CHAKRA_EVM_MAX_CATCHUP_BLOCKS
        value: "64"
      - key: CHAKRA_DISCOVERY_INTERVAL_SECS
        value: "600"
