# Render Blueprint — Chakra Arc Testnet DEX Aggregator

services:
  - type: kv
    name: chakra-redis
    plan: free

  - type: web
    name: chakra-api
    plan: free
    runtime: image
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: CHAKRA_REDIS_URL
        fromKeyValue:
          name: chakra-redis
          property: connectionString
      - key: CHAKRA_RPC_HTTP
        value: https://rpc.testnet.arc.io
      - key: CHAKRA_RPC_WS
        value: wss://rpc.testnet.arc.io
      - key: CHAKRA_RPC_HTTP_FAILOVERS
        value: https://rpc.blockdaemon.testnet.arc.io,https://rpc.drpc.testnet.arc.io,https://rpc.quicknode.testnet.arc.io
      - key: CHAKRA_RPC_WS_FAILOVERS
        value: wss://rpc.drpc.testnet.arc.io,wss://rpc.quicknode.testnet.arc.io
      - key: CHAKRA_CHAIN_ID
        value: "5042002"
      - key: CHAKRA_CORS_ORIGINS
        value: "https://chakra-arc-dex.vercel.app,https://frontend-ruddy-two-90.vercel.app,https://chakra-arc-dex-gadillacers-projects.vercel.app,http://localhost:3000"
      - key: CHAKRA_LISTEN_ADDR
        value: "0.0.0.0:10000"
      - key: CHAKRA_AGGREGATOR
        value: "0xeb12351602c56d47c4ee955193335848952b29d8"
      - key: CHAKRA_CIRBTC_ADDRESS
        value: "0xf0C4a4CE82A5746AbAAd9425360Ab04fbBA432BF"
      - key: CHAKRA_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: CHAKRA_EURC_ADDRESS
        value: "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a"
      - key: CHAKRA_PERMIT2
        value: "0x000000000022D473030F116dDEE9F6B43aC78BA3"
      - key: CHAKRA_XYLO_ROUTER
        value: "0x73742278c31a76dBb0D2587d03ef92E6E2141023"
      - key: CHAKRA_PRESTO_HUB
        value: "0x5794a8284A29493871Fbfa3c4f343D42001424D6"
      - key: CHAKRA_UNITFLOW_FACTORY
        value: "0xd67F63A4F26a497b364d1C82e6747Aec8B5743a5"
      - key: CHAKRA_SEED_FACTORIES
        value: "0x60EDeFB094B84BBC6430cc130B358A43Ba1979e2:xylo,0x5794a8284A29493871Fbfa3c4f343D42001424D6:presto,0xd67F63A4F26a497b364d1C82e6747Aec8B5743a5:xyk"
      - key: CHAKRA_DISCOVERY_FACTORIES
