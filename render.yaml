# Render Blueprint — Chakra Arc Mainnet DEX Aggregator

services:
  - type: kv
    name: chakra-redis
    plan: free

  - type: web
    name: chakra-api
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: CHAKRA_REDIS_URL
        # Set the existing Key Value connection URL with /1 for mainnet.
        # Keep testnet snapshots in database 0; never copy that URL unchanged.
        sync: false
      - key: CHAKRA_RPC_HTTP
        value: "https://rpc.mainnet.arc.io"
      - key: CHAKRA_RPC_WS
        value: "wss://rpc.blockdaemon.mainnet.arc.io/websocket"
      - key: CHAKRA_RPC_HTTP_FAILOVERS
        value: "https://rpc.blockdaemon.mainnet.arc.io,https://rpc.drpc.mainnet.arc.io,https://rpc.quicknode.mainnet.arc.io"
      - key: CHAKRA_RPC_WS_FAILOVERS
        value: "wss://rpc.quicknode.mainnet.arc.io"
      - key: CHAKRA_CHAIN_ID
        value: "5042"
      - key: CHAKRA_CORS_ORIGINS
        value: "https://chakra-ag.vercel.app,https://chakra-arc-dex.vercel.app,http://localhost:3000"
      - key: CHAKRA_LISTEN_ADDR
        value: "0.0.0.0:10000"
      - key: CHAKRA_AGGREGATOR
        value: "0x824af7339b4fFC04D0FD867953eCbfCc75dEAf18"
      - key: CHAKRA_CIRBTC_ADDRESS
        value: "0x171A4217b86A807A64eB94757Db6849fb4bDbAA0"
      - key: CHAKRA_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: CHAKRA_EURC_ADDRESS
        value: "0xbEf5f6d51CB62b58e6A8f77868681825C6fe21c1"
      - key: CHAKRA_PERMIT2
        value: "0x000000000022D473030F116dDEE9F6B43aC78BA3"
      - key: CHAKRA_XYLO_ROUTER
        value: ""
      - key: CHAKRA_PRESTO_HUB
        value: ""
      - key: CHAKRA_UNITFLOW_FACTORY
        value: "0x5bfBCeb73d39F722B1cB83fD2F11736b28c1Be6d"
      - key: CHAKRA_SEED_FACTORIES
        value: "0x5bfBCeb73d39F722B1cB83fD2F11736b28c1Be6d:clmm"
      - key: CHAKRA_DISCOVERY_FACTORIES
        value: ""
      - key: CHAKRA_ANALYTICS_ENABLED
        value: "true"
      - key: CHAKRA_ANALYTICS_START_BLOCK
        value: "26029398"
      - key: CHAKRA_ANALYTICS_POLL_SECS
        value: "30"
      - key: CHAKRA_ANALYTICS_CONFIRMATIONS
        value: "12"
      - key: CHAKRA_ANALYTICS_PAGE_BLOCKS
        value: "10000"
      - key: CHAKRA_STRICT_READINESS
        value: "true"
      - key: CHAKRA_EVM_WS_ENABLED
        value: "true"
      - key: CHAKRA_EVM_POLL_INTERVAL_MS
        value: "1000"
      - key: CHAKRA_EVM_MAX_CATCHUP_BLOCKS
        value: "64"
      - key: CHAKRA_DISCOVERY_INTERVAL_SECS
        value: "600"
