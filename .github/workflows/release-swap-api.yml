name: Release Chakra Binaries

on:
  push:
    tags:
      - "swap-api-v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binaries
        run: |
          cargo build --locked --release -p Chakra-swap-api -p api-server -p market-data-worker -p analytics-indexer -p limit-keeper
          cargo build --locked --release -p arbitrage --bin Chakra-arbitrage-bot

      - name: Verify tag and binary version
        run: |
          tag_version="${GITHUB_REF_NAME#swap-api-v}"
          binary_version="$(target/release/Chakra-swap-api --version | awk '{print $2}')"
          test "$tag_version" = "$binary_version"

      - name: Package release
        run: |
          swap_dir=Chakra-swap-api-linux-x86_64
          cluster_dir=Chakra-aggregator-linux-x86_64
          arb_dir=Chakra-arbitrage-bot-linux-x86_64
          keeper_dir=Chakra-limit-keeper-linux-x86_64

          mkdir "$swap_dir" "$cluster_dir" "$cluster_dir/systemd" "$arb_dir" "$keeper_dir"

          install -m 0755 target/release/Chakra-swap-api "$swap_dir/Chakra-swap-api"
          install -m 0644 LICENSE "$swap_dir/LICENSE"
          install -m 0644 docs/Chakra-swap-api.md "$swap_dir/README.md"
          install -m 0644 docs/openapi.yaml "$swap_dir/openapi.yaml"
          install -m 0644 packaging/Chakra-swap-api.toml "$swap_dir/Chakra-swap-api.toml"
          install -m 0644 packaging/Chakra-swap-api.service "$swap_dir/Chakra-swap-api.service"

          install -m 0755 target/release/Chakra-api-server "$cluster_dir/Chakra-api-server"
          install -m 0755 target/release/Chakra-market-data-worker "$cluster_dir/Chakra-market-data-worker"
          install -m 0755 target/release/Chakra-analytics-indexer "$cluster_dir/Chakra-analytics-indexer"
          install -m 0644 LICENSE "$cluster_dir/LICENSE"
          install -m 0644 docs/aggregator-deployment.md "$cluster_dir/README.md"
          install -m 0644 docs/aggregator-deployment.md "$cluster_dir/aggregator-deployment.md"
          install -m 0644 docs/deployment-overview.md "$cluster_dir/deployment-overview.md"
          install -m 0644 docs/Chakra-swap-api.md "$cluster_dir/Chakra-swap-api.md"
          install -m 0644 docs/arbitrage-deployment.md "$cluster_dir/arbitrage-deployment.md"
          install -m 0644 docs/arbitrage-configuration.md "$cluster_dir/arbitrage-configuration.md"
          install -m 0644 docs/contracts-deployment.md "$cluster_dir/contracts-deployment.md"
          install -m 0644 docs/round-trip-arb.md "$cluster_dir/round-trip-arb.md"
          install -m 0644 docs/integrator-guide.md "$cluster_dir/integrator-guide.md"
          install -m 0644 docs/api-reference.md "$cluster_dir/api-reference.md"
          install -m 0644 docs/scf-venue-comparison.md "$cluster_dir/scf-venue-comparison.md"
          install -m 0644 docs/scf-benchmark-results.md "$cluster_dir/scf-benchmark-results.md"
          install -m 0644 docs/aggregator-configuration.md "$cluster_dir/aggregator-configuration.md"
          install -m 0644 docs/analytics-indexer.md "$cluster_dir/analytics-indexer.md"
          install -m 0644 docs/arb-operator.md "$cluster_dir/arb-operator.md"
          install -m 0644 docs/sample-indexer-export.json "$cluster_dir/sample-indexer-export.json"
          install -m 0644 docs/openapi.yaml "$cluster_dir/openapi.yaml"
          install -m 0644 packaging/Chakra-aggregator.toml "$cluster_dir/Chakra-aggregator.toml"
          install -m 0644 packaging/Chakra-market-data-worker.service "$cluster_dir/systemd/"
          install -m 0644 packaging/Chakra-api@.service "$cluster_dir/systemd/"
          install -m 0644 packaging/Chakra-analytics-indexer.service "$cluster_dir/systemd/"

          install -m 0755 target/release/Chakra-arbitrage-bot "$arb_dir/Chakra-arbitrage-bot"
          install -m 0644 LICENSE "$arb_dir/LICENSE"
          install -m 0644 docs/arbitrage-deployment.md "$arb_dir/README.md"
          install -m 0644 docs/arbitrage-deployment.md "$arb_dir/arbitrage-deployment.md"
          install -m 0644 docs/arbitrage-configuration.md "$arb_dir/arbitrage-configuration.md"
          install -m 0644 docs/aggregator-deployment.md "$arb_dir/aggregator-deployment.md"
          install -m 0644 docs/aggregator-configuration.md "$arb_dir/aggregator-configuration.md"
          install -m 0644 docs/Chakra-swap-api.md "$arb_dir/Chakra-swap-api.md"
          install -m 0644 docs/integrator-guide.md "$arb_dir/integrator-guide.md"
          install -m 0644 docs/api-reference.md "$arb_dir/api-reference.md"
          install -m 0644 docs/scf-venue-comparison.md "$arb_dir/scf-venue-comparison.md"
          install -m 0644 docs/scf-benchmark-results.md "$arb_dir/scf-benchmark-results.md"
          install -m 0644 docs/contracts-deployment.md "$arb_dir/contracts-deployment.md"
          install -m 0644 docs/round-trip-arb.md "$arb_dir/round-trip-arb.md"
          install -m 0644 docs/arb-operator.md "$arb_dir/arb-operator.md"
          install -m 0644 docs/analytics-indexer.md "$arb_dir/analytics-indexer.md"
          install -m 0644 packaging/Chakra-arbitrage.toml "$arb_dir/Chakra-arbitrage.toml"
          install -m 0644 packaging/Chakra-arbitrage.service "$arb_dir/Chakra-arbitrage.service"

          install -m 0755 target/release/limit-keeper "$keeper_dir/Chakra-limit-keeper"
          install -m 0644 LICENSE "$keeper_dir/LICENSE"
          install -m 0644 docs/limit-dca-keeper.md "$keeper_dir/README.md"
          install -m 0644 crates/limit-keeper/README.md "$keeper_dir/limit-keeper-reference.md"
          install -m 0644 packaging/Chakra-limit-keeper.toml "$keeper_dir/Chakra-limit-keeper.toml"
          install -m 0644 packaging/Chakra-limit-keeper.service "$keeper_dir/Chakra-limit-keeper.service"

          tar -czf "$swap_dir.tar.gz" "$swap_dir"
          tar -czf "$cluster_dir.tar.gz" "$cluster_dir"
          tar -czf "$arb_dir.tar.gz" "$arb_dir"
          tar -czf "$keeper_dir.tar.gz" "$keeper_dir"
          sha256sum "$swap_dir.tar.gz" "$cluster_dir.tar.gz" "$arb_dir.tar.gz" "$keeper_dir.tar.gz" > SHA256SUMS

      - name: Smoke packaged archives
        run: ./scripts/smoke-release-archives.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Chakra ${GITHUB_REF_NAME#swap-api-v}" \
            Chakra-swap-api-linux-x86_64.tar.gz \
            Chakra-aggregator-linux-x86_64.tar.gz \
            Chakra-arbitrage-bot-linux-x86_64.tar.gz \
            Chakra-limit-keeper-linux-x86_64.tar.gz \
            SHA256SUMS
