name: Release Chakra Swap API

on:
  push:
    tags:
      - "swap-api-v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binary
        run: cargo build --locked --release -p Chakra-swap-api

      - name: Verify tag and binary version
        run: |
          tag_version="${GITHUB_REF_NAME#swap-api-v}"
          binary_version="$(target/release/Chakra-swap-api --version | awk '{print $2}')"
          test "$tag_version" = "$binary_version"

      - name: Package release
        env:
          ARCHIVE_DIR: Chakra-swap-api-linux-x86_64
        run: |
          mkdir "$ARCHIVE_DIR"
          install -m 0755 target/release/Chakra-swap-api "$ARCHIVE_DIR/Chakra-swap-api"
          install -m 0644 LICENSE "$ARCHIVE_DIR/LICENSE"
          install -m 0644 docs/Chakra-swap-api.md "$ARCHIVE_DIR/README.md"
          install -m 0644 scripts/Chakra-swap-api.env.example "$ARCHIVE_DIR/Chakra-swap-api.env.example"
          install -m 0644 packaging/Chakra-swap-api.service "$ARCHIVE_DIR/Chakra-swap-api.service"
          tar -czf "$ARCHIVE_DIR.tar.gz" "$ARCHIVE_DIR"
          sha256sum "$ARCHIVE_DIR.tar.gz" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Chakra Swap API ${GITHUB_REF_NAME#swap-api-v}" \
            Chakra-swap-api-linux-x86_64.tar.gz SHA256SUMS
