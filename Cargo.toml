[workspace]
members = [
    "crates/market-snapshot",
    "crates/market-data-worker",
    "crates/router-engine",
    "crates/dex-adapters",
    "crates/api-server",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mangekyou-labs/chakra"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Web
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Utilities
itertools = "0.14"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"

[profile.release]
opt-level = 2
lto = "thin"
overflow-checks = true
